name: Set up toolchain
description: Node and Bun with a dependency cache, then the workspace's dependencies.

runs:
  using: composite
  steps:
    # Node runs the build scripts (it strips their TypeScript types), Changesets and npm publish.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.3

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    # Vite+ (vp) comes with the dependencies, as the vite-plus package.
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
